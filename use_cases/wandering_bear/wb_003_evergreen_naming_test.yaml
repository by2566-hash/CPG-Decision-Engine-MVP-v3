# ── Use Case: WB-003 Evergreen Flavor Naming Test ────────────────────────────
# Single Source of Truth for all observed numbers [ADR-0011]
# meta_pattern_ref: conversion_merchandising_v1 (existing stub — to be promoted to meta)
# ─────────────────────────────────────────────────────────────────────────────

use_case_id: wb_003
brand: wandering_bear
meta_pattern_ref: conversion_merchandising_v1   # existing stub playbook
module: conversion
observed_at: "2023-Q1"
evidence_quality: high

calibration_value_for:
  - action_id: REORDER_SHELF
    gmv_lift_derivation:
      method: rate_lift_to_gmv_lift
      primary_metric: evergreen_atc_share
      lift_absolute_pp: 6.26              # 42.74% → 49.00% evergreen ATC share
      lift_relative_pct: 0.146            # 14.6% relative improvement
      ltv_premium_basis: "Evergreen SKUs have better LTV and subscription rates than LTO"
      pltv_roas_test: 1.42
      pltv_roas_control: 1.30
      pltv_roas_improvement_pct: 0.092    # (1.42 - 1.30) / 1.30
      gmv_lift_estimate: 0.09
      derivation_note: >
        Primary signal is evergreen ATC share lift (+14.6% relative).
        PLTV ROAS improvement (+9.2%) confirms downstream LTV impact.
        CVR and CPA were held neutral (test vs control within noise).

data_observed:
  test_name: "Fun names vs Regular names landing page naming test"
  test_objective: "Shift purchase intent toward evergreen flavors (better LTV + sub rates)"
  evaluation_metric: "evergreen_share_of_add_to_carts (NOT final checkout CVR)"

  test_arm:
    label: fun_names
    spend: 1900          # USD approx
    cpa: 71.00
    cvr: 0.0392          # 3.92%
    aov: 47.98
    pltv_roas: 1.42

  control_arm:
    label: regular_names
    spend: 1900          # USD approx
    cpa: 71.01
    cvr: 0.0358          # 3.58%
    aov: 47.02
    pltv_roas: 1.30

  ga4_measurement:
    evergreen_atc_share_control: 0.4274   # 42.74%
    evergreen_atc_share_test: 0.4900      # 49.00%
    lift_pp: 6.26
    lift_relative: 0.146

  variant_level_notes:
    - variant: "Original Black → Classic Black"
      result: "slightly worse — weak rename"
    - variant: "Decadent Mocha → Truffle Mocha"
      result: "materially worse — roll back this specific rename"
    - note: "Several other renames had low data volume — inconclusive individually"

action_taken: REORDER_SHELF   # COPY_TEST evaluation → keep stronger naming, iterate weaker variants
root_cause_confirmed: mix_problem   # mix problem (LTO vs evergreen distribution)

key_learning:
  evaluation_principle: >
    When a test changes naming/merchandising/framing with the intent of shifting
    product mix, judge on the intermediate metric (ATC mix shift), NOT final CVR.
    Final CVR was held constant — it was never the target metric.

counterfactual: >
  If judged on CVR alone, the test would have appeared mixed or marginal.
  The system would have missed a 14.6% relative improvement in evergreen purchase
  intent and the associated LTV/subscription rate downstream benefits.

outcome_value: >
  Test succeeded on its intended objective. Naming framework shifted purchase
  intent toward evergreen flavors (+6.26pp ATC share).
  PLTV ROAS improved from 1.30 to 1.42 (+9.2%).
  Action: keep stronger naming framework overall, roll back weak individual renames
  (Decadent Mocha, Original Black), iterate on low-data variants.
