# ── Brand Binding: Wandering Bear × acquisition_cac_channel_mix ──────────────
# Layer 2 (brand-level) [ADR-0011]
# RULE: No raw evidence data here. Evidence lives in use_cases/wandering_bear/.
# ─────────────────────────────────────────────────────────────────────────────

brand: wandering_bear
meta_pattern_ref: acquisition_cac_channel_mix
binding_version: "1.0"

entity_bindings:
  primary_ad_platform: meta
  on_platform_destinations: [ig_shop, fb_shop]  # destinations that caused CAC spike
  website_destination: shopify_pdp              # higher-converting destination
  diagnostic_signal: meta_content_views         # on-platform spike signal to watch

thresholds:
  cac_spike_ratio: 1.10                 # CAC >10% above 30d baseline → WATCH [partner_prior: Shaungh 2026-04-16]
  cac_critical_ratio: 1.20              # CAC >20% above 30d baseline → DEGRADING [partner_prior: Shaungh 2026-04-16]
  destination_cpp_gap_threshold: 1.20   # on-platform CPP > website × 1.20 → confirm routing [partner_prior: Shaungh 2026-04-16]
  # Note: CVR-based comparison replaced by CPP — CPP factors in CPM and CPC differentials
  # that CVR misses. On-platform CPP > website × 1.20 is the actionable routing signal.
  calibration_status: partner_prior

action_utility_priors:
  FIX_DESTINATION_ROUTING:
    # Full derivation: see use_cases/wandering_bear/wb_005_meta_destination_mix.yaml
    gmv_lift_prior: 0.12
    confidence: 0.75               # high: specific before/after numbers confirmed
    calibration_status: partner_prior
    evidence_case: "wb_005"        # Meta destination mix case

  REALLOCATE_BUDGET:
    # Full derivation: see use_cases/wandering_bear/wb_004_brand_vs_dr_cpa.yaml
    gmv_lift_prior: 0.07
    confidence: 0.65
    calibration_status: partner_prior
    evidence_case: "wb_004"        # Brand vs DR CPA split case

evidence_refs_template:
  - "WB CAC 7d: ${metrics.cac_7d} vs 30d baseline: ${metrics.cac_baseline_30d}"
  - "Meta on-platform content view delta: ${metrics.meta_content_views_wow_delta}% WoW"
  - "Checkout CVR: ${metrics.checkout_cvr} (website path performance unchanged)"
